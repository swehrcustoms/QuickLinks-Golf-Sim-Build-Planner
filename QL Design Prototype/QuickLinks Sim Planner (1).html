<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: sticky job bar + tabs; spec sidebar (shared across all three sheets) beside the active sheet; stacks on phones */
:root{
  --paper:#F2F5F2; --surface:#FFFFFF; --sunk:#E8EDE9; --ink:#14211A; --muted:#55665C; --line:#D2DBD4;
  --fair:#1B6E43; --fair-ink:#FFFFFF; --fair-soft:#DCEEE3; --turf:#4E9E5F; --turf2:#3B8A4D; --green:#7CC48A;
  --cad:#1D57A3; --cad-soft:#E3ECF8; --backing:#C2701A; --elec:#C0262D; --data:#6B3FB3; --tube:#0E8A8A;
  --warn:#9A6200; --warn-soft:#FBF0D9; --bad:#B42318; --bad-soft:#FBE4E1; --good:#1B6E43; --good-soft:#DCEEE3;
  --wallfill:#E3E8E4; --ceil:#D9DFDA; --screen:#F7F9FA; --sky1:#8EC5EA; --sky2:#DCEFFA; --hill:#5FA36A; --fairway:#7DBF6E;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1411; --surface:#151D19; --sunk:#1C2621; --ink:#E4ECE7; --muted:#93A59A; --line:#2B3832;
  --fair:#4CBB80; --fair-ink:#08130D; --fair-soft:#183427; --turf:#2F6B3C; --turf2:#275B33; --green:#3F8A50;
  --cad:#78A9EE; --cad-soft:#17253A; --backing:#E89A47; --elec:#F06A6F; --data:#B193EA; --tube:#3CC3C3;
  --warn:#E6B04B; --warn-soft:#33280F; --bad:#F2796D; --bad-soft:#3A1916; --good:#4CBB80; --good-soft:#183427;
  --wallfill:#222D27; --ceil:#1B231F; --screen:#2A3530; --sky1:#2F5F86; --sky2:#5D8DB0; --hill:#2F6B3C; --fairway:#3F8A50; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1411; --surface:#151D19; --sunk:#1C2621; --ink:#E4ECE7; --muted:#93A59A; --line:#2B3832;
  --fair:#4CBB80; --fair-ink:#08130D; --fair-soft:#183427; --turf:#2F6B3C; --turf2:#275B33; --green:#3F8A50;
  --cad:#78A9EE; --cad-soft:#17253A; --backing:#E89A47; --elec:#F06A6F; --data:#B193EA; --tube:#3CC3C3;
  --warn:#E6B04B; --warn-soft:#33280F; --bad:#F2796D; --bad-soft:#3A1916; --good:#4CBB80; --good-soft:#183427;
  --wallfill:#222D27; --ceil:#1B231F; --screen:#2A3530; --sky1:#2F5F86; --sky2:#5D8DB0; --hill:#2F6B3C; --fairway:#3F8A50; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fair);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--display);font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b i{font-style:normal;color:var(--fair)}
.brand span{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.jobpick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=number]{font-family:var(--mono);width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--fair)}
.btn.primary{background:var(--fair);color:var(--fair-ink);border-color:var(--fair)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.savestate{font-family:var(--mono);font-size:11px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-block:0}
nav.tabs button{border:0;background:none;padding:10px 14px 9px;border-bottom:3px solid transparent;cursor:pointer;font-family:var(--display);font-size:17px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
nav.tabs button small{font-family:var(--mono);font-size:10px;margin-right:6px;opacity:.8}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--fair)}
.banner{margin-top:12px;padding:8px 12px;border-radius:6px;background:var(--warn-soft);color:var(--ink);font-size:13px}
main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;padding-block:18px 48px;align-items:start}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
aside.spec{background:var(--surface);border:1px solid var(--line);border-radius:10px;position:sticky;top:110px;max-height:calc(100vh - 130px);overflow:auto}
@media (max-width:900px){aside.spec{position:static;max-height:none}}
.spec h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:15px;margin:0;padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.spec details:first-child h3{border-top:0}
.spec summary{list-style:none}
.spec summary::-webkit-details-marker{display:none}
.spec summary h3::after{content:"+";font-family:var(--mono);color:var(--muted)}
.spec details[open] summary h3::after{content:"–"}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:0 14px 14px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.f .hint{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px 12px}
.checks label{display:flex;gap:5px;align-items:center;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)}
.sheet{min-width:0;display:flex;flex-direction:column;gap:18px}
.sheet-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.sheet-head h1{font-family:var(--display);font-size:34px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.sheet-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.tb{font-family:var(--mono);font-size:11px;color:var(--muted);display:grid;grid-template-columns:auto auto;gap:2px 10px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--surface)}
.tb b{color:var(--ink);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel-h h2{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.panel-b{padding:12px 14px}
.drawing{overflow-x:auto}
.drawing svg{display:block;width:100%;height:auto;min-width:520px}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
@media (max-width:1200px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:10px 12px}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-family:var(--display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.fit{display:inline-flex;align-items:center;gap:6px;font-weight:600;border-radius:99px;padding:2px 10px;font-size:12px}
.fit.good{background:var(--good-soft);color:var(--good)} .fit.warn{background:var(--warn-soft);color:var(--warn)} .fit.bad{background:var(--bad-soft);color:var(--bad)}
ul.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.checklist li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;margin-top:5px}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.m{font-family:var(--mono);font-size:12px;white-space:nowrap}
tr.grp td{background:var(--sunk);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted)}
tr.total td{font-weight:600;border-bottom:0}
tr.grand td{font-family:var(--display);font-size:22px;border-top:2px solid var(--ink);border-bottom:0}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:10px;border-radius:2px;display:inline-block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;font-size:12px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps input{width:18px;height:18px;margin-top:2px;accent-color:var(--fair)}
.steps b{display:block}
.steps small{color:var(--muted)}
.steps li.done b{text-decoration:line-through;color:var(--muted)}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;width:160px}
.progress i{display:block;height:100%;background:var(--fair)}
.notes{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.notes li{margin-bottom:4px}
.pb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px 16px}
.pb-row{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;font-size:13px;min-width:0}
.pb-row input{text-align:right}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20}
.joblist{display:flex;flex-direction:column}
.jobrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.status{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:99px;background:var(--sunk)}
.example{font-family:var(--mono);font-size:11px;background:var(--warn-soft);color:var(--warn);padding:2px 8px;border-radius:99px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>

/* ---------------- Helpers ---------------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r1 = n=>Math.round(n*10)/10;
function ftin(inches){ if(!isFinite(inches)) return "—"; const neg=inches<0; let v=Math.abs(Math.round(inches*2)/2); let f=Math.floor(v/12), i=r1(v-f*12); if(i>=12){f++;i=0} return (neg?"−":"")+f+"'-"+i+'"'; }
const money = n=>"$"+Math.round(n).toLocaleString("en-US");
const lmOf = id=>LMS.find(l=>l.id===id)||LMS[0];

function hdmiFor(ft){const std=[15,25,35,50,75,100];const need=std.find(s=>s>=ft)||Math.ceil(ft/25)*25;return {len:need, aoc:need>25}}

/* ---------------- Geometry engine: one spec -> every sheet ---------------- */
function compute(sp){
  const W=+sp.W, D=+sp.D, H=+sp.H, chk=[];
  const [ax,ay]=sp.aspect.split(":").map(Number); const ratio=ax/ay;
  const scr={x0:+sp.sideTrim, x1:W-sp.sideTrim, y:+sp.screenOffset, z0:+sp.floorGap, z1:H-sp.topGap};
  scr.w=scr.x1-scr.x0; scr.h=scr.z1-scr.z0;
  let imgW=Math.min(scr.w, scr.h*ratio), imgH=imgW/ratio;
  const img={w:imgW,h:imgH,x0:(scr.x0+scr.x1)/2-imgW/2,z0:scr.z0}; img.x1=img.x0+imgW; img.z1=img.z0+imgH;
  const ball={x:W/2+(+sp.ballX), y:scr.y+(+sp.teeDist)};
  const handed=sp.handed; const stance=28;
  const golfers=[]; if(handed!=="LH") golfers.push({x:ball.x-stance,y:ball.y,side:"RH"}); if(handed!=="RH") golfers.push({x:ball.x+stance,y:ball.y,side:"LH"});
  const swingR=Math.round(sp.golferH*0.92);
  const mat=matOf(sp.mat); const m={x:ball.x-mat.w/2,y:ball.y-mat.d/2,w:mat.w,d:mat.d,name:mat.name};
  if(sp.mat==="m510"){ m.x=ball.x-mat.w/2; }
  /* Space checks (rules of thumb, labeled as such) */
  const needH=+sp.golferH+40;
  if(H<needH-6) chk.push(["bad",`Ceiling ${ftin(H)} is below the estimated driver swing height (~${ftin(needH)} for a ${ftin(sp.golferH)} golfer). Not recommended without a full-swing test.`]);
  else if(H<needH) chk.push(["warn",`Ceiling ${ftin(H)} is tight for a full driver swing (~${ftin(needH)} est.). Do a swing test with the client's driver.`]);
  else chk.push(["good",`Ceiling ${ftin(H)} clears the estimated driver swing height (~${ftin(needH)}).`]);
  if(sp.teeDist<120) chk.push(["warn",`Ball is ${ftin(sp.teeDist)} from the screen. 10'–12' is typical for ball speed reading and rebound safety.`]);
  else chk.push(["good",`Ball-to-screen ${ftin(sp.teeDist)} is in the typical 10'–12'+ range.`]);
  const behind=D-ball.y; if(behind<54) chk.push(["bad",`Only ${ftin(behind)} behind the ball. Allow about 4'–5' for the backswing and a walkway.`]); else if(behind<66) chk.push(["warn",`${ftin(behind)} behind the ball is workable but tight for seating.`]); else chk.push(["good",`${ftin(behind)} behind the ball for backswing and lounge space.`]);
  golfers.forEach(g=>{const toWall=g.side==="RH"?g.x:W-g.x; if(toWall<swingR*0.85) chk.push(["bad",`${g.side} golfer stands ${ftin(toWall)} from the ${g.side==="RH"?"left":"right"} wall; swing radius is ~${ftin(swingR)}. Move the ball or widen the bay.`]); else if(toWall<swingR) chk.push(["warn",`${g.side} golfer has ${ftin(toWall)} to the ${g.side==="RH"?"left":"right"} wall, slightly inside the ~${ftin(swingR)} swing radius.`]);});
  if(handed==="Both" && W<168) chk.push(["warn",`Dual-handed play usually wants 14'+ of width; this room is ${ftin(W)}.`]);

  /* Launch monitor */
  const L=lmOf(sp.lm); let lm;
  if(L.type==="overhead") lm={x:ball.x, y:ball.y+(L.offY||0)+(+sp.lmAdj), z:H-4, w:14, d:10, mount:"ceiling"};
  else if(L.type==="floor"){ const opp = handed==="LH"? -1 : 1; lm={x:ball.x+opp*26, y:ball.y, z:0, w:10, d:12, mount:"floor"}; if(handed==="Both") chk.push(["warn","Floor launch monitor must be moved to the opposite side for left-handed players. Plan an outlet on both sides."]); }
  else { lm={x:ball.x, y:Math.min(D-12, ball.y+96), z:0, w:8, d:8, mount:"floor"}; if(D-ball.y<96) chk.push(["warn","Rear radar needs ~8' behind the ball. Room is short for this unit."]); }
  lm.name=L.name; lm.type=L.type; lm.note=L.note;

  /* Projector */
  const P=projOf(sp.proj); const tr=+sp.tr||P.tr; const throwD=tr*img.w;
  const pj={x:(img.x0+img.x1)/2, y:scr.y+throwD, z:H-(+sp.projDrop), w:20, d:16, tr, throwD, name:P.name};
  if(pj.y>D-12) chk.push(["bad",`Projector needs ${ftin(throwD)} of throw; it would land past the rear wall. Pick a shorter throw ratio or a smaller image.`]);
  if(pj.y>ball.y){ const lensZ=pj.z+4; const zb=img.z0+(lensZ-img.z0)*(ball.y-scr.y)/(pj.y-scr.y); if(zb < +sp.golferH+6) chk.push(["warn",`Projector beam is only ~${ftin(zb)} high over the golfer, so the golfer may cast a shadow. Shorten the throw or raise the image.`]); else chk.push(["good",`Projector beam clears the golfer's head (~${ftin(zb)} at the ball).`]); }
  if(Math.abs(pj.y-ball.y)<60){ if(pj.z < needH) chk.push(["bad",`Projector bottom (${ftin(pj.z)}) is inside the estimated swing height above the hitting area. Use a flush ceiling enclosure, reduce the mount drop, or shift the throw.`]); else if(pj.z < needH+6) chk.push(["warn",`Projector bottom (${ftin(pj.z)}) is close to the swing height over the hitting area. Use a protective ceiling enclosure.`]); }
  if(L.type==="overhead" && Math.hypot(pj.x-lm.x,pj.y-lm.y)<24) chk.push(["warn","Projector and overhead launch monitor are within 2' of each other; confirm the LM's field of view is clear."]);

  /* Wall panels */
  const panels=[]; const run=Math.min(+sp.panelRun, D-scr.y);
  (sp.panelWalls||[]).forEach(wl=>{
    const len = wl==="rear"? W : run; const n=Math.ceil(len/48);
    for(let i=0;i<n;i++){ const a0 = wl==="rear"? i*48 : scr.y+i*48; const a1=Math.min(a0+48, wl==="rear"?W:scr.y+run); panels.push({wall:wl,a0,a1,z0:0,z1:Math.min(+sp.panelH,H)}); }
  });
  /* Computer cabinet */
  const cab={wall:sp.compWall, w:36, d:22, h:34}; const cp=+sp.compPos;
  if(sp.compWall==="rear"){ cab.a=Math.min(Math.max(cp+cab.w/2,cab.w/2),W-cab.w/2); cab.x=cab.a; cab.y=D-cab.d/2; }
  else { cab.a=Math.min(Math.max(D-cp-cab.w/2, scr.y+cab.w/2), D-cab.w/2); cab.y=cab.a; cab.x= sp.compWall==="left"? cab.d/2 : W-cab.d/2; }
  if(sp.compWall!=="rear" && Math.abs(cab.y-ball.y)<72) chk.push(["warn","Computer cabinet is beside the hitting area. Keep it out of the swing radius or behind padding."]);
  /* Monitor */
  let mon=null;
  if(sp.monitor==="wall"){ const wl = handed==="LH"?"left":"right"; mon={wall:wl, a:ball.y-6, z:48, w:24, h:14}; }
  else if(sp.monitor==="cabinet"){ mon={wall:cab.wall, a:cab.a, z:cab.h+10, w:24, h:14, onCab:true}; }
  /* TVs */
  const tvs=[]; const tvW=sp.tvSize*0.872, tvHt=sp.tvSize*0.49; const n=+sp.tvCount;
  for(let i=0;i<n;i++){
    let a; if(sp.tvWall==="rear"){ a=W*(i+1)/(n+1); } else { const y0=ball.y+36, y1=D-tvW/2-6; a = n===1? (y0+y1)/2 : y0+(y1-y0)*i/(n-1||1); a=Math.min(Math.max(a, scr.y+tvW/2), D-tvW/2); }
    tvs.push({wall:sp.tvWall, a, z:+sp.tvH, w:tvW, h:tvHt, size:sp.tvSize});
  }
  /* Turf + putting */
  const turfArea = sp.turf==="full"? W*(D-scr.y) : scr.w*(D-scr.y);
  const cutArea = sp.matCutout? m.w*m.d : 0;
  const greenY0=scr.y+24, greenY1=m.y-18; const green = greenY1-greenY0>=36 && +sp.cups>0 ? {x0:W/2-scr.w*0.32, x1:W/2+scr.w*0.32, y0:greenY0, y1:greenY1} : null;
  const cups=[]; if(+sp.cups>0){ if(!green) chk.push(["warn","Not enough room between the screen and the mat for a putting green. Cups would sit in the screen rebound zone."]); else { const k=+sp.cups; for(let i=0;i<k;i++){ cups.push({x: green.x0+(green.x1-green.x0)*(i+1)/(k+1), y: green.y0+(green.y1-green.y0)*(i%2?0.35:0.6)}); } } }
  /* Ceiling no-fixture zone */
  const nofix={x:ball.x, y:ball.y, r:swingR+12};

  /* ---------- Builder rough-in ---------- */
  const backing=[], elec=[], data=[], tubes=[];
  backing.push({id:"B1", label:"Screen frame ceiling blocking", where:"Ceiling", spec:"Continuous 2×6 blocking full width, centered on screen line", plan:{x:0,y:scr.y-6,w:W,d:12}, x:W/2, y:scr.y, z:H, size:`${ftin(W)} × 12"`});
  ["left","right"].forEach((wl,i)=>backing.push({id:"B"+(2+i), label:`Screen frame ${wl} wall backing`, where:wl[0].toUpperCase()+wl.slice(1)+" wall", spec:"2×6 vertical backing floor to ceiling, 16\" wide centered on screen line", wall:wl, a0:scr.y-8, a1:scr.y+8, z0:0, z1:H, x:wl==="left"?0:W, y:scr.y, z:H/2, size:`16" × ${ftin(H)}`}));
  backing.push({id:"B4", label:"Projector mount blocking", where:"Ceiling", spec:"2×8 solid blocking between joists, 24\"×24\" pad", plan:{x:pj.x-12,y:pj.y-12,w:24,d:24}, x:pj.x, y:pj.y, z:H, size:`24" × 24"`});
  if(lm.mount==="ceiling") backing.push({id:"B5", label:"Launch monitor blocking", where:"Ceiling", spec:"2×8 solid blocking, 24\"×36\" pad (long axis on target line)", plan:{x:lm.x-12,y:lm.y-18,w:24,d:36}, x:lm.x, y:lm.y, z:H, size:`24" × 36"`});
  tvs.forEach((t,i)=>backing.push({id:"B"+(6+i), label:`TV ${i+1} backing (${t.size}")`, where:cap(t.wall)+" wall", spec:"2×8 horizontal backing, two rows, spanning mount + 12\"", wall:t.wall, a0:t.a-t.w/2+6, a1:t.a+t.w/2-6, z0:t.z-14, z1:t.z+14, ...wallXY(t.wall,t.a,W,D), z:t.z, size:`${ftin(t.w-12)} × 28"`}));
  if(mon && !mon.onCab) backing.push({id:"B9", label:"Monitor arm backing", where:cap(mon.wall)+" wall", spec:"2×8 backing 16\"×16\"", wall:mon.wall, a0:mon.a-8, a1:mon.a+8, z0:mon.z-8, z1:mon.z+8, ...wallXY(mon.wall,mon.a,W,D), z:mon.z, size:`16" × 16"`});
  (sp.panelWalls||[]).forEach((wl,i)=>{ const a0 = wl==="rear"?0:scr.y, a1= wl==="rear"?W:scr.y+run; backing.push({id:"P"+(i+1), label:`Wall panel nailers — ${wl} wall`, where:cap(wl)+" wall", spec:`2×4 flat blocking rows at 3", 48" and ${Math.min(+sp.panelH,H)-3}" AFF; studs 16" o.c. at panel seams (48")`, wall:wl, a0, a1, z0:0, z1:Math.min(+sp.panelH,H), rows:[3,48,Math.min(+sp.panelH,H)-3], ...wallXY(wl,(a0+a1)/2,W,D), z:Math.min(+sp.panelH,H)/2, size:`${ftin(a1-a0)} run`}); });
  backing.push({id:"B10", label:"Computer cabinet backing", where:cap(cab.wall)+" wall", spec:"2×6 horizontal backing at 30\"–36\" AFF for cabinet anchors", wall:cab.wall, a0:cab.a-cab.w/2, a1:cab.a+cab.w/2, z0:28, z1:38, ...wallXY(cab.wall,cab.a,W,D), z:33, size:`${ftin(cab.w)} × 10"`});

  elec.push({id:"E1", label:"Projector receptacle", spec:"Duplex in ceiling, dedicated 20A circuit recommended", x:pj.x+16, y:pj.y, z:H, mount:"ceiling"});
  if(lm.mount==="ceiling") elec.push({id:"E2", label:"Launch monitor receptacle", spec:"Duplex in ceiling beside LM blocking", x:lm.x+18, y:lm.y, z:H, mount:"ceiling"});
  else { const fx=lm.x, fy=lm.y+(lm.type==="radar"?0:-18); elec.push({id:"E2", label:"Launch monitor floor box", spec:"Flush floor box w/ duplex + Cat6, set under turf with access flap", x:fx, y:fy, z:0, mount:"floor"}); if(handed==="Both"&&lm.type==="floor") elec.push({id:"E2b", label:"LM floor box (LH side)", spec:"Second floor box mirrored for left-handed setup", x:2*ball.x-fx, y:fy, z:0, mount:"floor"}); }
  elec.push({id:"E3", label:"Computer receptacles (2)", spec:"Two duplex at 18\" AFF behind cabinet; dedicated 20A", wall:cab.wall, a:cab.a, z:18, ...wallXY(cab.wall,cab.a,W,D), mount:"wall"});
  tvs.forEach((t,i)=>elec.push({id:"E"+(4+i), label:`TV ${i+1} recessed power`, spec:"Recessed power/low-voltage box behind TV center", wall:t.wall, a:t.a, z:t.z, ...wallXY(t.wall,t.a,W,D), mount:"wall"}));
  if(mon && !mon.onCab) elec.push({id:"E7", label:"Monitor receptacle", spec:"Duplex behind monitor", wall:mon.wall, a:mon.a, z:mon.z-4, ...wallXY(mon.wall,mon.a,W,D), mount:"wall"});
  elec.push({id:"E8", label:"Room lighting (by electrician)", spec:"Dimmable cans; none inside the red no-fixture ring; keep light off the screen", x:W/2, y:Math.min(D-30,ball.y+swingR+30), z:H, mount:"ceiling", note:true});
  data.push({id:"D1", label:"Cat6 at computer", spec:"2× Cat6 to network, terminate at cabinet", wall:cab.wall, a:cab.a+8, z:18, ...wallXY(cab.wall,cab.a+8,W,D)});
  if(lm.mount==="ceiling") data.push({id:"D2", label:"Cat6 at launch monitor", spec:"Cat6 pulled to LM location (USB/ethernet extension)", x:lm.x-18, y:lm.y, z:H});

  const compPt={x:cab.x, y:cab.y};
  const addTube=(id,label,from,fromZ,fromKind)=>{ const run = Math.abs(from.x-compPt.x)+Math.abs(from.y-compPt.y); const vert = fromKind==="ceiling"? (H-18) : fromKind==="wall"? (H-fromZ)+(H-18) : 18; const len=(run+vert)*1.15/12; const h=hdmiFor(len); tubes.push({id,label,from,len, pts:[[from.x,from.y],[from.x,compPt.y],[compPt.x,compPt.y]], cable: h}); };
  addTube("T1","Projector → computer",pj,H,"ceiling");
  if(lm.mount==="ceiling") addTube("T2","Launch monitor → computer",lm,H,"ceiling"); else addTube("T2","LM floor box → computer",{x:lm.x,y:lm.y},0,"floor");
  tvs.forEach((t,i)=>addTube("T"+(3+i),`TV ${i+1} → computer`, wallXY(t.wall,t.a,W,D), t.z,"wall"));
  if(mon && !mon.onCab) addTube("T6","Monitor → computer", wallXY(mon.wall,mon.a,W,D), mon.z,"wall");

  const fit = chk.some(c=>c[0]==="bad")?"bad":chk.some(c=>c[0]==="warn")?"warn":"good";
  return {W,D,H,scr,img,ball,golfers,swingR,mat:m,lm,pj,panels,cab,mon,tvs,turfArea,cutArea,green,cups,nofix,backing,elec,data,tubes,chk,fit,run,needH};
}
function cap(s){return s[0].toUpperCase()+s.slice(1)}
function wallXY(wall,a,W,D){ if(wall==="left")return{x:0,y:a}; if(wall==="right")return{x:W,y:a}; if(wall==="rear")return{x:a,y:D}; return{x:a,y:0}; }

/* ---------------- Quote ---------------- */
function quote(sp,c,pb){
  const L=[]; const add=(grp,item,qty,unit,price,hrs,taxable=true)=>L.push({grp,item,qty,unit,price,ext:qty*price,hrs:hrs||0,taxable});
  const sqft=c.scr.w*c.scr.h/144;
  add("Screen & enclosure","Impact screen, wall-to-wall built-in",r1(sqft),"sq ft",pb.screenSqft,pb["hr:screen"]);
  add("Screen & enclosure","Built-in frame + padding kit",1,"kit",pb.frameKit,0);
  if(c.panels.length) add("Screen & enclosure",`Wall panels (${(sp.panelWalls||[]).join(", ")})`,c.panels.length,"ea",pb.panel,c.panels.length*pb["hr:panel"]);
  const turfSq=Math.max(0,(c.turfArea-c.cutArea)/144);
  add("Floor","Turf "+(sp.turf==="full"?"(full room)":"(hitting bay)"),Math.round(turfSq),"sq ft",pb.turfSqft,turfSq/100*pb["hr:turf100"]);
  add("Floor",c.mat.name,1,"ea",pb["mat:"+sp.mat]||0,0);
  if(sp.matCutout) add("Floor","Mat inset / flush cutout framing",1,"ea",pb.matCutout,pb["hr:mat"]);
  if(c.cups.length) add("Floor","Putting cups",c.cups.length,"ea",pb.cup,c.cups.length*pb["hr:cup"]);
  add("Launch monitor",c.lm.name,1,"ea",pb["lm:"+sp.lm]||0,c.lm.mount==="ceiling"?pb["hr:lmOver"]:pb["hr:lmFloor"]);
  if(c.lm.mount==="ceiling") add("Launch monitor","Overhead mount",1,"ea",pb.lmMount,0);
  add("Launch monitor","Software: "+(SOFT.find(s=>s.id===sp.software)||SOFT[0]).name,1,"license",pb["sw:"+sp.software]||0,0);
  add("Projection & tech",c.pj.name,1,"ea",pb["pj:"+sp.proj]||0,pb["hr:proj"]);
  add("Projection & tech","Projector mount",1,"ea",pb.projMount,0);
  add("Projection & tech","Simulator computer",1,"ea",pb.computer,pb["hr:pc"]);
  if(c.mon) add("Projection & tech","Computer monitor",1,"ea",pb.monitor,pb["hr:mon"]);
  if(c.tvs.length){ add("Projection & tech",`TV ${sp.tvSize}"`,c.tvs.length,"ea",pb.tv,c.tvs.length*pb["hr:tv"]); add("Projection & tech","TV mount",c.tvs.length,"ea",pb.tvMount,0); }
  const ft=Math.round(c.tubes.reduce((s,t)=>s+t.len,0)); add("Projection & tech","HDMI/USB/Cat6 cabling + tech tube",ft,"ft",pb.cablePerFt,0);
  const hours=L.reduce((s,l)=>s+l.hrs,0)+pb["hr:cal"];
  const equip=L.reduce((s,l)=>s+l.ext,0);
  const labor=hours*pb.laborRate; const design=pb.designFee; const tax=equip*pb.taxRate/100; const disc=+(S.job.discount ?? pb.discount)||0;
  return {lines:L, hours, equip, labor, design, tax, disc, total:equip+labor+design+tax-disc};
}

/* ---------------- SVG: plan view ---------------- */
function planSVG(c, mode){
  const {W,D}=c, pad=Math.max(W,D)*0.16, fs=Math.max(W,D)/42;
  const vb=[-pad,-pad,W+pad*2,D+pad*2];
  let g=`<svg viewBox="${vb.join(" ")}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Plan view">`;
  for(let x=0;x<=W;x+=12) g+=`<line class="s-grid" x1="${x}" y1="0" x2="${x}" y2="${D}"/>`;
  for(let y=0;y<=D;y+=12) g+=`<line class="s-grid" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`;
  // turf
  const tx0 = S.job.spec.turf==="full"?0:c.scr.x0, tx1=S.job.spec.turf==="full"?W:c.scr.x1;
  g+=`<rect class="s-turf" x="${tx0}" y="${c.scr.y}" width="${tx1-tx0}" height="${D-c.scr.y}"/>`;
  if(mode==="builder") g+=`<circle class="s-nofix" cx="${c.nofix.x}" cy="${c.nofix.y}" r="${c.nofix.r}"/><text class="s-lblm" x="${c.nofix.x}" y="${c.nofix.y+c.nofix.r-fs*0.6}" text-anchor="middle" font-size="${fs*0.75}">No ceiling fixtures / sprinklers in ring</text>`;
  // panels
  c.panels.forEach(p=>{ const t=4; if(p.wall==="left") g+=`<rect class="s-panel" x="0" y="${p.a0}" width="${t}" height="${p.a1-p.a0}"/>`; else if(p.wall==="right") g+=`<rect class="s-panel" x="${W-t}" y="${p.a0}" width="${t}" height="${p.a1-p.a0}"/>`; else g+=`<rect class="s-panel" x="${p.a0}" y="${D-t}" width="${p.a1-p.a0}" height="${t}"/>`; });
  // green + cups
  if(c.green){ const gr=c.green; g+=`<rect class="s-green" x="${gr.x0}" y="${gr.y0}" width="${gr.x1-gr.x0}" height="${gr.y1-gr.y0}" rx="${(gr.y1-gr.y0)/2}"/>`; }
  c.cups.forEach(cu=>g+=`<circle class="s-cup" cx="${cu.x}" cy="${cu.y}" r="${mode==="sales"?3:2.2}"/>`);
  // mat
  const m=c.mat; g+=`<rect class="s-mat" x="${m.x}" y="${m.y}" width="${m.w}" height="${m.d}"/>`;
  if(S.job.spec.matCutout) g+=`<rect class="s-matcut" x="${m.x-1}" y="${m.y-1}" width="${m.w+2}" height="${m.d+2}"/>`;
  g+=`<rect class="s-strip" x="${c.ball.x-6}" y="${c.ball.y-10}" width="12" height="20"/>`;
  // screen
  g+=`<rect class="s-screen" x="${c.scr.x0}" y="${c.scr.y-1.5}" width="${c.scr.w}" height="3"/>`;
  // throw cone
  if(mode!=="builder") g+=`<polygon class="s-throw" points="${c.pj.x},${c.pj.y} ${c.img.x0},${c.scr.y} ${c.img.x1},${c.scr.y}"/>`;
  // golfer + swing
  if(mode!=="builder") c.golfers.forEach(go=>{ g+=`<circle class="s-swing" cx="${go.x}" cy="${go.y}" r="${c.swingR}"/><ellipse class="s-golfer" cx="${go.x}" cy="${go.y}" rx="9" ry="14"/>`; });
  g+=`<circle class="s-ball" cx="${c.ball.x}" cy="${c.ball.y}" r="2"/>`;
  // cabinet
  const cb=c.cab; let cbr; if(cb.wall==="rear") cbr={x:cb.a-cb.w/2,y:D-cb.d,w:cb.w,h:cb.d}; else if(cb.wall==="left") cbr={x:0,y:cb.a-cb.w/2,w:cb.d,h:cb.w}; else cbr={x:W-cb.d,y:cb.a-cb.w/2,w:cb.d,h:cb.w};
  g+=`<rect class="s-equip" x="${cbr.x}" y="${cbr.y}" width="${cbr.w}" height="${cbr.h}"/>`;
  // TVs + monitor (wall)
  const wallRect=(wall,a,w,t)=> wall==="left"?{x:0,y:a-w/2,w:t,h:w}: wall==="right"?{x:W-t,y:a-w/2,w:t,h:w}: wall==="rear"?{x:a-w/2,y:D-t,w:w,h:t}:{x:a-w/2,y:0,w:w,h:t};
  c.tvs.forEach(t=>{const r=wallRect(t.wall,t.a,t.w,5); g+=`<rect class="s-tv" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"/>`;});
  if(c.mon && !c.mon.onCab){const r=wallRect(c.mon.wall,c.mon.a,c.mon.w,4); g+=`<rect class="s-tv" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"/>`;}
  // LM + projector
  const lm=c.lm; g+=`<rect class="${lm.mount==="ceiling"?"s-equip":"s-equipfill"}" x="${lm.x-lm.w/2}" y="${lm.y-lm.d/2}" width="${lm.w}" height="${lm.d}" ${lm.mount==="ceiling"?'stroke-dasharray="3 2"':""}/>`;
  g+=`<rect class="s-equip" x="${c.pj.x-10}" y="${c.pj.y-8}" width="20" height="16" stroke-dasharray="3 2"/><circle class="s-equipfill" cx="${c.pj.x}" cy="${c.pj.y-8}" r="3"/>`;
  // builder layers
  if(mode==="builder"){
    c.backing.forEach(b=>{ if(b.plan) g+=`<rect class="s-backing" x="${b.plan.x}" y="${b.plan.y}" width="${b.plan.w}" height="${b.plan.d}"/>`; else if(b.wall){ const t=7; const r = b.wall==="left"?{x:-t,y:b.a0,w:t,h:b.a1-b.a0}: b.wall==="right"?{x:W,y:b.a0,w:t,h:b.a1-b.a0}:{x:b.a0,y:D,w:b.a1-b.a0,h:t}; g+=`<rect class="s-backing" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"/>`; } });
    c.tubes.forEach(t=>g+=`<polyline class="s-tube" points="${t.pts.map(p=>p.join(",")).join(" ")}"/>`);
    c.elec.forEach(e=>g+=elecSym(e.x,e.y,fs*0.55,e.mount,e.note));
    c.data.forEach(d=>g+=`<polygon class="s-data" points="${d.x},${d.y-fs*0.45} ${d.x+fs*0.4},${d.y+fs*0.3} ${d.x-fs*0.4},${d.y+fs*0.3}"/>`);
    // tags
    c.backing.forEach(b=>{const p=tagPos(b,W,D,fs); g+=callout(p.x,p.y,b.id,fs*0.62,"var(--backing)");});
    c.elec.forEach(e=>g+=callout(clampIn(e.x+fs*1.1,W),clampIn(e.y-fs*0.9,D),e.id,fs*0.55,"var(--elec)"));
  }
  // walls
  g+=`<rect class="s-wall" x="0" y="0" width="${W}" height="${D}"/>`;
  // labels
  g+=`<text class="s-lbl" x="${W/2}" y="${-pad*0.62}" text-anchor="middle" font-size="${fs}">SCREEN WALL</text>`;
  if(mode==="sales"){
    g+=`<text class="s-lblm" x="${c.ball.x}" y="${m.y+m.d+fs*1.3}" text-anchor="middle" font-size="${fs*0.8}">Hitting mat</text>`;
    if(c.green) g+=`<text class="s-lblm" x="${W/2}" y="${(c.green.y0+c.green.y1)/2+fs*0.3}" text-anchor="middle" font-size="${fs*0.75}">Putting green</text>`;
    g+=`<text class="s-lblm" x="${c.pj.x+14}" y="${c.pj.y+4}" font-size="${fs*0.75}">Projector</text>`;
  }
  // dims
  g+=dimH(0,W,-pad*0.32,ftin(W),fs);
  g+=dimV(0,D,W+pad*0.32,ftin(D),fs);
  if(mode!=="builder"){
    g+=dimV(c.scr.y,c.ball.y,c.ball.x - (S.job.spec.handed==="LH"?-1:1)*(m.w/2+fs*1.6), "Ball "+ftin(c.ball.y-c.scr.y),fs*0.85);
    g+=dimV(c.scr.y,c.pj.y,c.pj.x+ m.w/2+fs*3.2,"Throw "+ftin(c.pj.y-c.scr.y),fs*0.85);
  }
  if(mode==="installer"){
    g+=dimH(0,c.ball.x,D+pad*0.32,"Ball X "+ftin(c.ball.x),fs*0.85);
    g+=dimV(0,c.scr.y,-pad*0.32,ftin(c.scr.y),fs*0.8);
    // numbered callouts
    placements(c).forEach((p,i)=>{ if(p.px!=null) g+=callout(clampIn(p.px+fs*1.0,W),clampIn(p.py-fs*1.0,D),i+1,fs*0.62,"var(--ink)"); });
  }
  g+=`<text class="s-lblm" x="${-pad*0.62}" y="${D/2}" text-anchor="middle" font-size="${fs*0.8}" transform="rotate(-90 ${-pad*0.62} ${D/2})">LEFT WALL</text>`;
  g+=`<text class="s-lblm" x="${W+pad*0.7}" y="${D/2}" text-anchor="middle" font-size="${fs*0.8}" transform="rotate(90 ${W+pad*0.7} ${D/2})">RIGHT WALL</text>`;
  g+=`<text class="s-lblm" x="${W/2}" y="${D+pad*0.75}" text-anchor="middle" font-size="${fs*0.8}">REAR WALL · scale 1 sq = 1'</text>`;
  return g+"</svg>";
}
function clampIn(v,max){return Math.max(6,Math.min(max-6,v))}
function tagPos(b,W,D,fs){ if(b.plan) return {x:clampIn(b.plan.x+b.plan.w+fs*0.7,W), y:clampIn(b.plan.y-fs*0.2,D)}; if(b.wall==="left") return {x:fs*1.4,y:(b.a0+b.a1)/2}; if(b.wall==="right") return {x:W-fs*1.4,y:(b.a0+b.a1)/2}; return {x:(b.a0+b.a1)/2,y:D-fs*1.4}; }
function callout(x,y,txt,r,color){ return `<circle cx="${x}" cy="${y}" r="${r}" style="fill:${color}"/><text class="s-calltxt" x="${x}" y="${y+r*0.38}" text-anchor="middle" font-size="${r*1.05}">${txt}</text>`; }
function elecSym(x,y,r,mount,note){ if(note) return `<circle class="s-elec" cx="${x}" cy="${y}" r="${r}" stroke-dasharray="2 2"/>`; const sq = mount==="floor"? `<rect class="s-elec" x="${x-r}" y="${y-r}" width="${r*2}" height="${r*2}"/>` : `<circle class="s-elec" cx="${x}" cy="${y}" r="${r}"/>`; return sq+`<line class="s-elec" x1="${x-r*0.4}" y1="${y-r*0.5}" x2="${x-r*0.4}" y2="${y+r*0.5}"/><line class="s-elec" x1="${x+r*0.4}" y1="${y-r*0.5}" x2="${x+r*0.4}" y2="${y+r*0.5}"/>`; }
function dimH(x1,x2,y,label,fs){ const t=fs*0.4; return `<line class="s-dim" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><line class="s-dim" x1="${x1}" y1="${y-t}" x2="${x1}" y2="${y+t}"/><line class="s-dim" x1="${x2}" y1="${y-t}" x2="${x2}" y2="${y+t}"/><text class="s-dimtxt" x="${(x1+x2)/2}" y="${y-t*0.8}" text-anchor="middle" font-size="${fs*0.85}" style="paint-order:stroke;stroke:var(--surface);stroke-width:${fs*0.3}">${label}</text>`; }
function dimV(y1,y2,x,label,fs){ const t=fs*0.4, my=(y1+y2)/2; return `<line class="s-dim" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/><line class="s-dim" x1="${x-t}" y1="${y1}" x2="${x+t}" y2="${y1}"/><line class="s-dim" x1="${x-t}" y1="${y2}" x2="${x+t}" y2="${y2}"/><text class="s-dimtxt" x="${x-t*0.8}" y="${my}" text-anchor="middle" font-size="${fs*0.85}" transform="rotate(-90 ${x-t*0.8} ${my})" style="paint-order:stroke;stroke:var(--surface);stroke-width:${fs*0.3}">${label}</text>`; }

/* ---------------- SVG: wall elevations ---------------- */
function elevSVG(c, wall, mode){
  const {W,D,H}=c; const len = (wall==="screen"||wall==="rear")?W:D;
  const U = a => wall==="screen"?a: wall==="rear"? W-a : wall==="left"? D-a : a; // along-wall coord -> drawing x
  const Z = z => H - z;
  const pad=Math.max(len,H)*0.14, fs=Math.max(len,H)/38;
  let g=`<svg viewBox="${-pad} ${-pad} ${len+pad*2} ${H+pad*2}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${wall} wall elevation">`;
  for(let x=0;x<=len;x+=16) g+=`<line class="s-stud" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`;
  // section items for side walls
  if(wall==="left"||wall==="right"){
    const sx=U(c.scr.y); g+=`<line class="s-screen" x1="${sx}" y1="${Z(c.scr.z1)}" x2="${sx}" y2="${Z(c.scr.z0)}"/><text class="s-lblm" x="${sx+(wall==="left"?-4:4)}" y="${Z(c.scr.z1)+fs}" text-anchor="${wall==="left"?"end":"start"}" font-size="${fs*0.7}">Screen</text>`;
    g+=`<rect class="s-turf" x="${Math.min(U(c.scr.y),U(D))}" y="${H-2}" width="${Math.abs(U(D)-U(c.scr.y))}" height="2"/>`;
    // projector & LM in section (dashed)
    const pjx=U(c.pj.y); g+=`<rect class="s-equip" x="${pjx-10}" y="${Z(c.pj.z)}" width="20" height="8" stroke-dasharray="3 2"/><line class="s-zone" x1="${pjx}" y1="0" x2="${pjx}" y2="${Z(c.pj.z)}"/>`;
    if(mode!=="builder") g+=`<text class="s-lblm" x="${pjx}" y="${Z(c.pj.z)+fs*1.6}" text-anchor="middle" font-size="${fs*0.65}">Projector (section)</text>`;
    if(c.lm.mount==="ceiling"){const lx=U(c.lm.y); g+=`<rect class="s-equip" x="${lx-7}" y="${Z(c.lm.z)}" width="14" height="5" stroke-dasharray="3 2"/>`;}
    else {const lx=U(c.lm.y); g+=`<rect class="s-equipfill" x="${lx-5}" y="${Z(6)}" width="10" height="6"/>`;}
    // swing envelope
    if(mode!=="builder"){ const bx=U(c.ball.y); g+=`<line class="s-swing" x1="${bx-c.swingR*0.6}" y1="${Z(c.needH)}" x2="${bx+c.swingR*0.6}" y2="${Z(c.needH)}"/><text class="s-lblm" x="${bx}" y="${Z(c.needH)-fs*0.4}" text-anchor="middle" font-size="${fs*0.65}">Est. swing height ${ftin(c.needH)}</text>`; }
  }
  if(wall==="screen"){
    g+=`<rect class="s-screen" x="${c.scr.x0}" y="${Z(c.scr.z1)}" width="${c.scr.w}" height="${c.scr.h}" style="stroke-width:2"/>`;
    g+=`<rect class="s-image" x="${c.img.x0}" y="${Z(c.img.z1)}" width="${c.img.w}" height="${c.img.h}"/>`;
    g+=`<text class="s-lblm" x="${W/2}" y="${Z(c.img.z1)+fs*1.3}" text-anchor="middle" font-size="${fs*0.75}">Projected image ${ftin(c.img.w)} × ${ftin(c.img.h)} (${S.job.spec.aspect})</text>`;
  }
  // panels on this wall
  c.panels.filter(p=>p.wall===wall).forEach(p=>{ const x0=Math.min(U(p.a0),U(p.a1)), x1=Math.max(U(p.a0),U(p.a1)); g+=`<rect class="s-panel" x="${x0}" y="${Z(p.z1)}" width="${x1-x0}" height="${p.z1-p.z0}" style="opacity:.8"/>`; });
  // cabinet
  if(c.cab.wall===wall){ const x=U(c.cab.a); g+=`<rect class="s-equip" x="${x-c.cab.w/2}" y="${Z(c.cab.h)}" width="${c.cab.w}" height="${c.cab.h}"/><text class="s-lblm" x="${x}" y="${Z(c.cab.h/2)}" text-anchor="middle" font-size="${fs*0.65}">PC cabinet</text>`; }
  c.tvs.filter(t=>t.wall===wall).forEach((t,i)=>{ const x=U(t.a); g+=`<rect class="s-tv" x="${x-t.w/2}" y="${Z(t.z+t.h/2)}" width="${t.w}" height="${t.h}"/>`; });
  if(c.mon && c.mon.wall===wall){ const x=U(c.mon.a); g+=`<rect class="s-tv" x="${x-c.mon.w/2}" y="${Z(c.mon.z+c.mon.h/2)}" width="${c.mon.w}" height="${c.mon.h}"/>`; }
  if(mode==="builder"){
    c.backing.filter(b=>b.wall===wall).forEach(b=>{ const x0=Math.min(U(b.a0),U(b.a1)), x1=Math.max(U(b.a0),U(b.a1)); if(b.rows){ b.rows.forEach(r=>g+=`<rect class="s-backing" x="${x0}" y="${Z(r+1.75)}" width="${x1-x0}" height="3.5"/>`); } else g+=`<rect class="s-backing" x="${x0}" y="${Z(b.z1)}" width="${x1-x0}" height="${b.z1-b.z0}"/>`; g+=callout(Math.min(len-6,x1+fs*0.9), Z(b.z1)+fs*0.2, b.id, fs*0.55, "var(--backing)"); });
    // ceiling blocking seen in section on side walls
    if(wall==="left"||wall==="right") c.backing.filter(b=>b.plan).forEach(b=>{ const x0=Math.min(U(b.plan.y),U(b.plan.y+b.plan.d)), x1=Math.max(U(b.plan.y),U(b.plan.y+b.plan.d)); g+=`<rect class="s-backing" x="${x0}" y="0" width="${x1-x0}" height="7"/>`; });
    if(wall==="screen") c.backing.filter(b=>b.id==="B1").forEach(()=>g+=`<rect class="s-backing" x="0" y="0" width="${W}" height="7"/>`);
    c.elec.filter(e=>e.wall===wall).forEach(e=>{ const x=U(e.a); g+=elecSym(x,Z(e.z),fs*0.5,"wall")+`<text class="s-dimtxt" x="${x}" y="${Z(e.z)+fs*1.3}" text-anchor="middle" font-size="${fs*0.6}">${e.id} @ ${ftin(e.z)} AFF</text>`; });
    c.data.filter(d=>d.wall===wall).forEach(d=>{ const x=U(d.a); g+=`<polygon class="s-data" points="${x},${Z(d.z)-fs*0.4} ${x+fs*0.36},${Z(d.z)+fs*0.3} ${x-fs*0.36},${Z(d.z)+fs*0.3}"/>`; });
    // tube drops on this wall: toward computer
    if(c.cab.wall===wall){ const x=U(c.cab.a); g+=`<line class="s-tube" x1="${x-6}" y1="0" x2="${x-6}" y2="${Z(18)}"/><text class="s-dimtxt" x="${x-6+fs*0.4}" y="${fs*1.4}" font-size="${fs*0.6}">2" tech tubes ↓</text>`; }
    c.tvs.filter(t=>t.wall===wall).forEach(t=>{ const x=U(t.a)+6; g+=`<line class="s-tube" x1="${x}" y1="${Z(t.z)}" x2="${x}" y2="0"/>`; });
  }
  // outline
  g+=`<line class="s-wall" x1="0" y1="${H}" x2="${len}" y2="${H}"/><rect class="s-wallthin" x="0" y="0" width="${len}" height="${H}"/>`;
  g+=dimH(0,len,-pad*0.35,ftin(len),fs);
  g+=dimV(0,H,len+pad*0.35,ftin(H)+" clg",fs);
  if(wall==="screen") g+=dimV(Z(c.scr.z1),Z(c.scr.z0), -pad*0.35, "Screen "+ftin(c.scr.h), fs*0.85) + dimH(c.scr.x0,c.scr.x1,H+pad*0.35,"Screen "+ftin(c.scr.w),fs*0.85);
  c.tvs.filter(t=>t.wall===wall).forEach(t=>g+=dimV(Z(t.z),H,U(t.a)+t.w/2+fs*0.7,ftin(t.z)+" ctr",fs*0.75));
  const names={screen:"SCREEN WALL — looking at screen", left:"LEFT WALL — screen at right", right:"RIGHT WALL — screen at left", rear:"REAR WALL — looking back"};
  g+=`<text class="s-lbl" x="0" y="${H+pad*0.72}" font-size="${fs*0.9}">${names[wall]}</text>`;
  return g+"</svg>";
}

/* ---------------- SVG: sales perspective render ---------------- */
function perspectiveSVG(c){
  const {W,D,H}=c; const camY=D+70, camX=W/2+(S.job.spec.handed==="LH"?-10:10), camZ=H*0.58;
  const P=(x,y,z)=>{const d=camY-y; return [ (x-camX)/d*1000, -(z-camZ)/d*1000 ];};
  const poly=(pts,cls,extra="")=>`<polygon class="${cls}" ${extra} points="${pts.map(p=>P(...p).map(v=>v.toFixed(1)).join(",")).join(" ")}"/>`;
  const corners=[[0,D,0],[W,D,0],[0,D,H],[W,D,H],[0,0,0],[W,0,H]].map(p=>P(...p));
  const xs=corners.map(p=>p[0]), ys=corners.map(p=>p[1]); const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const pw=(maxX-minX)*0.04;
  let g=`<svg viewBox="${minX-pw} ${minY-pw} ${maxX-minX+pw*2} ${maxY-minY+pw*2}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rendered view of the simulator bay"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky1)"/><stop offset="1" stop-color="var(--sky2)"/></linearGradient><pattern id="turfp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" class="s-floor"/><path d="M0 6 L3 0" class="s-stud" style="stroke:var(--turf2);opacity:.5"/></pattern></defs>`;
  g+=poly([[0,0,H],[W,0,H],[W,D,H],[0,D,H]],"s-ceil");
  g+=poly([[0,0,0],[0,D,0],[0,D,H],[0,0,H]],"s-side");
  g+=poly([[W,0,0],[W,D,0],[W,D,H],[W,0,H]],"s-side2");
  g+=poly([[0,0,0],[W,0,0],[W,0,H],[0,0,H]],"s-side2");
  g+=poly([[0,c.scr.y,0],[W,c.scr.y,0],[W,D,0],[0,D,0]],"s-floor",`fill="url(#turfp)"`);
  // panels on side walls
  c.panels.forEach(p=>{ if(p.wall==="left") g+=poly([[0.5,p.a0+1,p.z0],[0.5,p.a1-1,p.z0],[0.5,p.a1-1,p.z1],[0.5,p.a0+1,p.z1]],"s-panel"); if(p.wall==="right") g+=poly([[W-0.5,p.a0+1,p.z0],[W-0.5,p.a1-1,p.z0],[W-0.5,p.a1-1,p.z1],[W-0.5,p.a0+1,p.z1]],"s-panel"); });
  // TVs on side walls
  c.tvs.forEach(t=>{ if(t.wall==="left"||t.wall==="right"){const x=t.wall==="left"?1:W-1; const q=[[x,t.a-t.w/2,t.z-t.h/2],[x,t.a+t.w/2,t.z-t.h/2],[x,t.a+t.w/2,t.z+t.h/2],[x,t.a-t.w/2,t.z+t.h/2]]; g+=poly(q,"s-tv"); }});
  if(c.mon && !c.mon.onCab && c.mon.wall!=="rear"){const x=c.mon.wall==="left"?1:W-1; g+=poly([[x,c.mon.a-c.mon.w/2,c.mon.z-c.mon.h/2],[x,c.mon.a+c.mon.w/2,c.mon.z-c.mon.h/2],[x,c.mon.a+c.mon.w/2,c.mon.z+c.mon.h/2],[x,c.mon.a-c.mon.w/2,c.mon.z+c.mon.h/2]],"s-tv");}
  // screen frame + image scene
  const s=c.scr, im=c.img, y=s.y;
  g+=poly([[s.x0,y,s.z0],[s.x1,y,s.z0],[s.x1,y,s.z1],[s.x0,y,s.z1]],"s-screen");
  const [ix0,iz1]=P(im.x0,y,im.z1), [ix1,iz0]=P(im.x1,y,im.z0); const iw=ix1-ix0, ih=iz0-iz1;
  g+=`<rect class="s-sky" x="${ix0}" y="${iz1}" width="${iw}" height="${ih}"/>`;
  g+=`<path class="s-hill" d="M${ix0} ${iz1+ih*0.62} Q${ix0+iw*0.25} ${iz1+ih*0.48} ${ix0+iw*0.5} ${iz1+ih*0.58} T${ix1} ${iz1+ih*0.55} L${ix1} ${iz0} L${ix0} ${iz0}Z"/>`;
  g+=`<path class="s-fairway" d="M${ix0+iw*0.3} ${iz0} L${ix0+iw*0.47} ${iz1+ih*0.62} L${ix0+iw*0.55} ${iz1+ih*0.62} L${ix0+iw*0.75} ${iz0}Z"/>`;
  g+=`<line class="s-pole" x1="${ix0+iw*0.51}" y1="${iz1+ih*0.63}" x2="${ix0+iw*0.51}" y2="${iz1+ih*0.53}"/><polygon class="s-flag" points="${ix0+iw*0.51},${iz1+ih*0.53} ${ix0+iw*0.535},${iz1+ih*0.55} ${ix0+iw*0.51},${iz1+ih*0.57}"/>`;
  // green + cups
  if(c.green){ const gr=c.green; g+=poly([[gr.x0,gr.y0,0.2],[gr.x1,gr.y0,0.2],[gr.x1,gr.y1,0.2],[gr.x0,gr.y1,0.2]],"s-green"); }
  c.cups.forEach(cu=>{const [cx,cy]=P(cu.x,cu.y,0.3); const [ex]=P(cu.x+2.2,cu.y,0.3); const rx=Math.abs(ex-cx); g+=`<ellipse class="s-cup" cx="${cx}" cy="${cy}" rx="${rx}" ry="${rx*0.35}" style="fill:var(--ink)"/>`;});
  // mat
  const m=c.mat; g+=poly([[m.x,m.y,0.5],[m.x+m.w,m.y,0.5],[m.x+m.w,m.y+m.d,0.5],[m.x,m.y+m.d,0.5]],"s-mat");
  g+=poly([[c.ball.x-6,c.ball.y-10,0.7],[c.ball.x+6,c.ball.y-10,0.7],[c.ball.x+6,c.ball.y+10,0.7],[c.ball.x-6,c.ball.y+10,0.7]],"s-strip");
  // cabinet (side walls only — rear is behind camera)
  const cb=c.cab; if(cb.wall!=="rear"){ const x0=cb.wall==="left"?0:W-cb.d, x1=cb.wall==="left"?cb.d:W; const y0=cb.a-cb.w/2,y1=cb.a+cb.w/2; g+=poly([[x0,y0,cb.h],[x1,y0,cb.h],[x1,y1,cb.h],[x0,y1,cb.h]],"s-equip"); const fx=cb.wall==="left"?x1:x0; g+=poly([[fx,y0,0],[fx,y1,0],[fx,y1,cb.h],[fx,y0,cb.h]],"s-equip"); }
  // LM
  const lm=c.lm; if(lm.mount==="ceiling") g+=poly([[lm.x-7,lm.y-5,H-6],[lm.x+7,lm.y-5,H-6],[lm.x+7,lm.y+5,H-6],[lm.x-7,lm.y+5,H-6]],"s-equipfill");
  else g+=poly([[lm.x-5,lm.y-6,6],[lm.x+5,lm.y-6,6],[lm.x+5,lm.y+6,0.5],[lm.x-5,lm.y+6,0.5]],"s-equipfill");
  // projector
  const pj=c.pj; if(pj.y<camY-20){ g+=poly([[pj.x-10,pj.y-8,pj.z-7],[pj.x+10,pj.y-8,pj.z-7],[pj.x+10,pj.y+8,pj.z-7],[pj.x-10,pj.y+8,pj.z-7]],"s-equipfill"); const [mx,my]=P(pj.x,pj.y,H), [bx,by]=P(pj.x,pj.y,pj.z-7); g+=`<line class="s-pole" x1="${mx}" y1="${my}" x2="${bx}" y2="${by}" style="stroke-width:2"/>`; }
  // ball
  const [bx,by]=P(c.ball.x,c.ball.y,1); g+=`<circle class="s-ball" cx="${bx}" cy="${by}" r="${Math.max(1.5,(P(c.ball.x+1,c.ball.y,1)[0]-bx)*1.6)}"/>`;
  return g+"</svg>";
}

function placements(c){
  const sp=S.job.spec, W=c.W, D=c.D; const rows=[];
  const add=(item,x,y,z,mount,notes,px,py)=>rows.push({item,x,y,z,mount,notes,px:px??x,py:py??y});
  add("Impact screen (face)", null, c.scr.y, `${ftin(c.scr.z0)}–${ftin(c.scr.z1)}`, "Frame to blocking", `Screen ${ftin(c.scr.w)} × ${ftin(c.scr.h)}; ${ftin(sp.sideTrim)} trim each side; face ${ftin(c.scr.y)} off back wall`, W/2, c.scr.y);
  add("Ball position / hitting strip", c.ball.x, c.ball.y, 0, "Floor", `Snap target line from screen center to ball. ${sp.handed==="Both"?"Dual-handed":sp.handed} setup.`);
  add("Hitting mat"+(sp.matCutout?" (flush inset)":""), c.mat.x, c.mat.y, 0, "Floor", `${c.mat.name}; corner dims are the mat's left-front corner${sp.matCutout?"; cut turf/subfloor to mat size +1/8\"":""}`, c.mat.x, c.mat.y);
  add("Launch monitor — "+c.lm.name, r1(c.lm.x), r1(c.lm.y), c.lm.mount==="ceiling"?ftin(c.lm.z)+" (to unit)":"Floor", c.lm.mount==="ceiling"?"Ceiling":"Floor", c.lm.note+" Positions are planning values; final aim per manufacturer.");
  add("Projector (lens)", r1(c.pj.x), r1(c.pj.y), ftin(c.pj.z), "Ceiling", `Throw ${ftin(c.pj.throwD)} at TR ${c.pj.tr}; image ${ftin(c.img.w)} wide. Verify lens offset with the manufacturer calculator.`);
  if(c.green) c.cups.forEach((cu,i)=>add(`Putting cup ${i+1}`, r1(cu.x), r1(cu.y), 0, "Floor", "4¼\" hole; set cup ½\" below turf"));
  const cp=wallXY(c.cab.wall,c.cab.a,W,D); add("Computer cabinet", r1(cp.x), r1(cp.y), ftin(c.cab.h)+" top", cap(c.cab.wall)+" wall", `Center on wall point; ${ftin(c.cab.w)} wide × ${ftin(c.cab.d)} deep`);
  if(c.mon){ const mp=c.mon.onCab?cp:wallXY(c.mon.wall,c.mon.a,W,D); add("Computer monitor", r1(mp.x), r1(mp.y), ftin(c.mon.z)+" ctr", c.mon.onCab?"On cabinet":cap(c.mon.wall)+" wall", c.mon.onCab?"Desk stand on cabinet":"Arm on backing B9; outside swing radius"); }
  c.tvs.forEach((t,i)=>{const p=wallXY(t.wall,t.a,W,D); add(`TV ${i+1} (${t.size}")`, r1(p.x), r1(p.y), ftin(t.z)+" ctr", cap(t.wall)+" wall", "Mount to backing; tube behind TV");});
  (sp.panelWalls||[]).forEach(wl=>{ const ps=c.panels.filter(p=>p.wall===wl); if(!ps.length)return; const a0=ps[0].a0, a1=ps[ps.length-1].a1; const p0=wallXY(wl,a0,W,D); add(`Wall panels — ${wl} (${ps.length})`, r1(p0.x), r1(p0.y), `0–${ftin(ps[0].z1)}`, cap(wl)+" wall", `Start at ${wl==="rear"?"left corner":"screen line"}, run ${ftin(a1-a0)}; 48" panels`); });
  add("Turf", 0, c.scr.y, 0, "Floor", `${sp.turf==="full"?"Wall to wall":"Screen width"} from screen line to rear wall; ~${Math.round((c.turfArea-c.cutArea)/144)} sq ft net`, null, null);
  rows.forEach(r=>{ if(r.item==="Turf"){ r.px=null; } });
  return rows;
}
function steps(c){
  const sp=S.job.spec; const s=[
    ["verify","Verify rough-in against the Builder sheet","Backing, receptacles, Cat6 and tech tubes in place; photo each before panels go up."],
    ["layout","Snap layout lines","Screen line, target line, ball center, mat outline, projector and LM points (from the schedule)."]];
  if(c.panels.length) s.push(["panels","Install wall panels",`${c.panels.length} panels to the nailer rows; start at the screen line.`]);
  s.push(["screen","Hang screen frame and impact screen","Fasten to B1–B3 backing; tension evenly; check for wrinkles in projected area."]);
  s.push(["turf","Lay turf"+(sp.matCutout?" and cut mat inset":""),sp.matCutout?"Cut inset to mat size +1/8\"; mat surface flush with turf.":"Seam away from the hitting area."]);
  if(c.cups.length) s.push(["cups","Cut and set putting cups",`${c.cups.length} cups per schedule.`]);
  s.push(["lm","Mount launch monitor",c.lm.mount==="ceiling"?"Bolt to B5; level; aim at hitting area per manufacturer.":"Set unit at marked spot; route power/data from floor box."]);
  s.push(["proj","Mount projector",`Lens at ${ftin(c.pj.y)} from back wall; square to screen, keystone off, fill image ${ftin(c.img.w)}.`]);
  s.push(["pc","Set computer and pull cables","HDMI/USB/Cat6 through tubes; label both ends."]);
  if(c.tvs.length||c.mon) s.push(["tv","Mount TVs and monitor","On marked backing; hide cables in tubes."]);
  s.push(["cal","Software install and calibration","Launch monitor alignment, screen alignment, test shots both handed if dual."]);
  s.push(["walk","Client walkthrough and photos","Run a session with the client; upload photos to the job notes."]);
  return s;
}

function getVal(path){ if(path.startsWith("s.")){const k=path.slice(2); return S.job.spec[k];} return S.job[path]; }
function setVal(path,v){ if(path.startsWith("s.")) S.job.spec[path.slice(2)]=v; else S.job[path]=v; }
function buildForm(){
  let h="";
  FORM.forEach(([title,fields,open],si)=>{
    h+=`<details ${open||si===1?"open":""}><summary><h3>${title}</h3></summary><div class="fields">`;
    fields.forEach(([path,label,type,o={}])=>{
      const id="f_"+path.replace(".","_");
      h+=`<div class="f ${o.full?"full":""}"><label for="${id}">${label}</label>`;
      if(type==="select") h+=`<select id="${id}" data-p="${path}">${o.opts.map(op=>{const [v,t]=Array.isArray(op)?op:[op,op];return `<option value="${esc(v)}">${esc(t)}</option>`}).join("")}</select>`;
      else if(type==="checks") h+=`<div class="checks">${o.opts.map(op=>`<label><input type="checkbox" id="${id}_${op}" data-p="${path}" data-v="${op}"> ${op==="yes"?"Inset mat flush with turf":cap(op)}</label>`).join("")}</div>`;
      else h+=`<input id="${id}" data-p="${path}" type="${type}" ${o.step?`step="${o.step}"`:""}>`;
      if(o.hint) h+=`<span class="hint" id="${id}_h"></span>`;
      h+=`</div>`;
    });
    h+=`</div></details>`;
  });
  h+=`<details><summary><h3>Notes</h3></summary><div class="fields"><div class="f full"><label for="f_notes">Job notes</label><textarea id="f_notes" data-p="notes" rows="4"></textarea></div></div></details>`;
  $("#spec").innerHTML=h;
  $("#spec").addEventListener("input",onField); $("#spec").addEventListener("change",onField);
}
function fillForm(){
  document.querySelectorAll("#spec [data-p]").forEach(el=>{
    const p=el.dataset.p, v=getVal(p);
    if(el.type==="checkbox"){ if(p==="s.matCutout") el.checked=!!v; else el.checked=(v||[]).includes(el.dataset.v); }
    else el.value = v ?? "";
  });
  updateHints();
}
function updateHints(){ ["W","D","H","golferH","teeDist","panelRun"].forEach(k=>{const e=document.getElementById("f_s_"+k+"_h"); if(e) e.textContent=ftin(+S.job.spec[k]);}); }
function onField(e){
  const el=e.target; const p=el.dataset.p; if(!p) return;
  let v;
  if(el.type==="checkbox"){ if(p==="s.matCutout") v=el.checked; else { const cur=new Set(getVal(p)||[]); el.checked?cur.add(el.dataset.v):cur.delete(el.dataset.v); v=[...cur]; } }
  else if(el.type==="number") v = el.value===""? "" : +el.value;
  else v=el.value;
  setVal(p,v);
  if(p==="s.proj"){ S.job.spec.tr=projOf(v).tr; const t=$("#f_s_tr"); if(t) t.value=S.job.spec.tr; }
  if(["s.tvCount","s.cups"].includes(p)) S.job.spec[p.slice(2)]=+v;
  updateHints(); markDirty(); scheduleRender();
}

function titleBlock(){ const j=S.job; return `<div class="tb"><span>Job</span><b>${esc(j.name)}</b><span>Client</span><b>${esc(j.client||"—")} · ${esc(j.clientType)}</b><span>Location</span><b>${esc(j.location||"—")}</b><span>Status</span><b>${esc(j.status)}${j.example?' <span class="example">example</span>':""}</b></div>`; }
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  $("#spec").hidden = (S.tab==="prices"||S.tab==="jobs");
  $("main").style.gridTemplateColumns = $("#spec").hidden? "minmax(0,1fr)":"";
  const sh=$("#sheet");
  if(S.tab==="prices") return sh.innerHTML=pricesHTML();
  if(S.tab==="jobs") return sh.innerHTML=jobsHTML();
  if(!validSpec(S.job.spec)){ sh.innerHTML=`<div class="panel"><div class="panel-b">Enter room width (min 8'), depth (min 10') and ceiling (min 7') to draw the plan.</div></div>`; return; }
  const c=compute(S.job.spec);

  return `<div class="sheet-head"><div><h1>Builder Rough-In CAD</h1><p>For the home builder, remodeler or homeowner's trades: where to put backing, receptacles, low-voltage and 2" tech tubes before drywall. Dimensions are from the left wall (X, facing the screen) and the screen/back wall (Y).</p></div>${titleBlock()}</div>
  <div class="panel"><div class="panel-h"><h2>Reflected ceiling + floor plan</h2>${S.downloads?'<button class="btn" data-act="dl-builder">Download builder sheet</button>':""}</div><div class="panel-b"><div class="drawing">${planSVG(c,"builder")}</div>
    <div class="legend" style="margin-top:8px"><span><i class="sw" style="background:var(--backing);opacity:.5"></i>Backing / blocking</span><span><svg width="14" height="14" viewBox="-7 -7 14 14">${elecSym(0,0,5.5,"ceiling")}</svg>Receptacle</span><span><svg width="14" height="14" viewBox="-7 -7 14 14">${elecSym(0,0,5.5,"floor")}</svg>Floor box</span><span><svg width="14" height="14" viewBox="-7 -7 14 14"><polygon class="s-data" points="0,-5 5,4 -5,4"/></svg>Cat6</span><span><i class="sw" style="border-top:2px dashed var(--tube);height:0"></i>2" tech tube</span><span><i class="sw" style="border:1px dashed var(--bad)"></i>No-fixture ring</span></div></div></div>
  <div class="panel"><div class="panel-h"><h2>Wall elevation</h2>${wallSeg()}</div><div class="panel-b"><div class="drawing">${elevSVG(c,S.elevWall,"builder")}</div></div></div>
  <div class="panel"><div class="panel-h"><h2>Backing schedule</h2></div><div class="panel-b tablewrap"><table><thead><tr><th>Tag</th><th>Item</th><th>Where</th><th>Spec</th><th>Location</th><th>Size</th></tr></thead><tbody>${bRows}</tbody></table></div></div>
  <div class="grid2">
    <div class="panel"><div class="panel-h"><h2>Electrical + low voltage</h2></div><div class="panel-b tablewrap"><table><thead><tr><th>Tag</th><th>Item</th><th>Spec</th><th>Location</th><th>Height</th></tr></thead><tbody>${eRows}</tbody></table></div></div>
    <div class="panel"><div class="panel-h"><h2>Tech tubes</h2></div><div class="panel-b tablewrap"><table><thead><tr><th>Tag</th><th>Run</th><th class="n">Est. length</th><th>Pull</th></tr></thead><tbody>${tRows}</tbody></table>
    <ul class="notes" style="margin-top:10px"><li>2" ENT (smurf tube) with pull string, sweeps not 90° elbows, terminate in a low-voltage ring at each end.</li><li>Runs over 25 ft: plan active optical HDMI and powered USB or USB-over-Cat6 extenders.</li></ul></div></div>
  </div>
  <div class="panel"><div class="panel-h"><h2>General notes for the trades</h2></div><div class="panel-b"><ul class="notes">
    <li>Finished ceiling must be ≥ ${ftin(c.H)} as drawn. Any soffit, duct or beam inside the swing ring changes this plan — send a photo to QuickLinks before framing.</li>
    <li>Solid blocking between joists at every ceiling pad, regardless of joist direction. No sprinkler heads, can lights or HVAC registers inside the no-fixture ring or between the projector and the screen.</li>
    <li>Screen wall: flat, smooth finish; paint the screen wall and the first 4' of ceiling flat black or dark grey to cut reflected light.</li>
    <li>${sp.matCutout?`Flush mat inset ${ftin(c.mat.w)} × ${ftin(c.mat.d)} at the mat location; slab or subfloor must be level within 1/8" over 10'.`:"Floor must be level within 1/8\" over 10' for the hitting mat."}</li>
    <li>Dedicated 20A circuits for projector and computer; light switches on a dimmer at the room entry.</li>
  </ul></div></div>`;
}
function wallSeg(){ return `<div class="seg" role="group" aria-label="Choose wall">${["screen","left","right","rear"].map(w=>`<button data-act="wall" data-v="${w}" aria-pressed="${S.elevWall===w}">${cap(w)}</button>`).join("")}</div>`; }

function installerHTML(c){
  const pl=placements(c); const st=steps(c); const cl=S.job.checklist||{};
  const done=st.filter(s=>cl[s[0]]).length;
  const rows=pl.map((p,i)=>`<tr><td class="m">${i+1}</td><td>${esc(p.item)}</td><td class="m">${p.x==null?"—":ftin(p.x)}</td><td class="m">${ftin(p.y)}</td><td class="m">${typeof p.z==="number"?ftin(p.z):esc(p.z)}</td><td>${esc(p.mount)}</td><td>${esc(p.notes)}</td></tr>`).join("");
  return `<div class="sheet-head"><div><h1>Installer Build Plan</h1><p>Exact placement for the crew. X is measured from the left wall (facing the screen), Y from the screen/back wall. Numbers on the plan match the schedule.</p></div>${titleBlock()}</div>
  <div class="panel"><div class="panel-h"><h2>Placement plan</h2>${S.downloads?'<button class="btn" data-act="dl-installer">Download installer sheet</button>':""}</div><div class="panel-b"><div class="drawing">${planSVG(c,"installer")}</div></div></div>
  <div class="panel"><div class="panel-h"><h2>Placement schedule</h2></div><div class="panel-b tablewrap"><table><thead><tr><th>#</th><th>Item</th><th>X (left wall)</th><th>Y (back wall)</th><th>Height</th><th>Mount</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="grid2">
    <div class="panel"><div class="panel-h"><h2>Wall elevation</h2>${wallSeg()}</div><div class="panel-b"><div class="drawing">${elevSVG(c,S.elevWall,"installer")}</div></div></div>
    <div class="panel"><div class="panel-h"><h2>Install sequence</h2><div style="display:flex;align-items:center;gap:8px"><span class="savestate">${done}/${st.length}</span><div class="progress"><i style="width:${st.length?done/st.length*100:0}%"></i></div></div></div><div class="panel-b">
      <ol class="steps">${st.map(([k,t,d])=>`<li class="${cl[k]?"done":""}"><input type="checkbox" id="st_${k}" data-act="step" data-v="${k}" ${cl[k]?"checked":""} aria-label="${esc(t)}"><label for="st_${k}"><b>${esc(t)}</b><small>${esc(d)}</small></label></li>`).join("")}</ol>
      ${S.currentId?"":'<p class="savestate">Save the job to keep checklist progress.</p>'}</div></div>
  </div>
  <div class="panel"><div class="panel-h"><h2>Space check carried from sales</h2>${fitPill(c.fit)}</div><div class="panel-b">${checksHTML(c)}</div></div>`;
}

function pricesHTML(){
  const can = !!S.db;
  return `<div class="sheet-head"><div><h1>Price Book</h1><p>One shared price book drives every quote at this location. Defaults are placeholders, not supplier pricing — replace them with your distributor costs and target sell prices.</p></div></div>
  ${PB_LABELS.map(([g,items])=>`<div class="panel"><div class="panel-h"><h2>${g}</h2></div><div class="panel-b pb-grid">${items.map(([k,l])=>`<label class="pb-row" for="pb_${k.replace(/[:]/g,"_")}"><span>${esc(l)}</span><input type="number" step="0.01" id="pb_${k.replace(/[:]/g,"_")}" data-pb="${k}" value="${S.pb[k]??""}"></label>`).join("")}</div></div>`).join("")}
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="savepb" ${can?"":"disabled"}>Save price book</button><button class="btn" data-act="resetpb">Restore defaults</button>${can?"":'<span class="savestate">Saving is unavailable in this view; changes apply to this session only.</span>'}</div>`;
}
function jobsHTML(){
  const list=[...S.jobs.entries()].sort((a,b)=>(b[1].updatedAt||0)-(a[1].updatedAt||0));
  const by={}; list.forEach(([id,j])=>{(by[j.status]=by[j.status]||[]).push([id,j]);});
  const body = list.length? STATUSES.filter(s=>by[s]).map(s=>`<div class="panel"><div class="panel-h"><h2>${s}</h2><span class="savestate">${by[s].length}</span></div><div class="panel-b joblist">${by[s].map(([id,j])=>`<div class="jobrow"><div style="min-width:0"><b>${esc(j.name)}</b><div class="savestate">${esc(j.client||"—")} · ${esc(j.location||"—")} · ${esc(j.clientType)} · updated ${j.updatedAt?new Date(j.updatedAt).toLocaleDateString():"—"}</div></div><span class="status">${ftin(j.spec?.W)} × ${ftin(j.spec?.D)}</span><button class="btn" data-act="open" data-v="${id}">Open</button></div>`).join("")}</div></div>`).join("")
   : `<div class="panel"><div class="panel-b"><b>No saved jobs yet.</b><p class="savestate">Start from the example on the Sales tab, enter the client's room, and press Save job. Saved jobs appear here for every location, grouped by status.</p></div></div>`;
  return `<div class="sheet-head"><div><h1>Jobs</h1><p>Every saved build, shared with the team. Open one to load its spec into all three sheets.</p></div></div>${body}`;
}

/* ---------------- Actions ---------------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act],[data-tab]"); if(!t) return;
  if(t.dataset.tab){ S.tab=t.dataset.tab; try{history.replaceState(null,"","#"+S.tab)}catch(_){} render(); window.scrollTo({top:0}); return; }
  const a=t.dataset.act, v=t.dataset.v;
  if(a==="wall"){S.elevWall=v; render();}
  if(a==="cv"){S.clientView=v==="1"; render();}
  if(a==="copyquote") copyQuote();
  if(a==="open") openJob(v);
  if(a==="savepb") savePB();
  if(a==="resetpb"){S.pb={...DEFAULT_PB}; render(); toast("Defaults restored — press Save to share them");}
  if(a&&a.startsWith("dl-")) download(a.slice(3));
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.act==="step"){ S.job.checklist={...(S.job.checklist||{}), [t.dataset.v]:t.checked}; markDirty(); render(); }
  if(t.dataset.pb){ S.pb[t.dataset.pb]=+t.value; }
});
document.addEventListener("input",e=>{ if(e.target.dataset.pb){ S.pb[e.target.dataset.pb]=+e.target.value; } });

function copyQuote(){
  const c=compute(S.job.spec), q=quote(S.job.spec,c,S.pb), j=S.job;
  const txt=[`QuickLinks Golf — Simulator proposal`,`${j.name} · ${j.client||""} · ${j.location||""}`,`Room ${ftin(c.W)} W × ${ftin(c.D)} D × ${ftin(c.H)} H · Image ${ftin(c.img.w)} × ${ftin(c.img.h)}`,"",...q.lines.map(l=>`${l.item} — ${l.qty} ${l.unit} — ${money(l.ext)}`),"",`Equipment & materials: ${money(q.equip)}`,`Installation: ${money(q.labor)}`,`Design + CAD: ${money(q.design)}`,`Tax: ${money(q.tax)}`,q.disc?`Discount: −${money(q.disc)}`:"",`Estimated total: ${money(q.total)}`].filter(x=>x!=="").join("\n");
  navigator.clipboard.writeText(txt).then(()=>toast("Quote copied")).catch(()=>toast("Copy blocked here — select the table instead"));
}

/* ---------------- Export sheets (downloads capability) ---------------- */
async function download(kind){
  if(!S.downloads) return;
  const c=compute(S.job.spec), j=S.job;
  const css=`:root{--paper:#fff;--surface:#fff;--sunk:#EEF2EF;--ink:#14211A;--muted:#55665C;--line:#D2DBD4;--fair:#1B6E43;--turf:#4E9E5F;--turf2:#3B8A4D;--green:#7CC48A;--cad:#1D57A3;--backing:#C2701A;--elec:#C0262D;--data:#6B3FB3;--tube:#0E8A8A;--warn:#9A6200;--bad:#B42318;--good:#1B6E43;--wallfill:#E3E8E4;--ceil:#D9DFDA;--screen:#F7F9FA;--sky1:#8EC5EA;--sky2:#DCEFFA;--hill:#5FA36A;--fairway:#7DBF6E}
body{font-family:Helvetica,Arial,sans-serif;color:#14211A;margin:24px;font-size:12px}h1{font-size:22px;margin:0}h2{font-size:14px;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid #14211A;padding-bottom:4px;margin-top:22px}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ccc;padding:4px 6px;text-align:left;vertical-align:top}th{font-size:10px;text-transform:uppercase}svg{width:100%;height:auto;page-break-inside:avoid}.meta{color:#55665C}.n{text-align:right}@media print{h2{page-break-after:avoid}}`+document.getElementById("svgcss").textContent;
  const head=`<h1>QuickLinks Golf — ${kind==="sales"?"Simulator Proposal":kind==="builder"?"Builder Rough-In Sheet":"Installer Build Plan"}</h1><p class="meta">${esc(j.name)} · ${esc(j.client||"")} (${esc(j.clientType)}) · ${esc(j.location||"")} · Room ${ftin(c.W)} W × ${ftin(c.D)} D × ${ftin(c.H)} ceiling · Issued ${new Date().toLocaleDateString()}</p><p class="meta">X = from left wall facing the screen. Y = from screen/back wall. Planning document — confirm on site before cutting.</p>`;
  let body="";
  const tmp=document.createElement("div");
  if(kind==="sales"){ const q=quote(j.spec,c,S.pb); body=`<h2>Your simulator</h2>${perspectiveSVG(c)}<h2>Floor plan</h2>${planSVG(c,"sales")}<h2>Proposal</h2><table><tbody>${q.lines.map(l=>`<tr><td>${esc(l.item)}</td><td class="n">${l.qty} ${l.unit}</td><td class="n">${money(l.ext)}</td></tr>`).join("")}<tr><td colspan="2">Equipment &amp; materials</td><td class="n">${money(q.equip)}</td></tr><tr><td colspan="2">Installation</td><td class="n">${money(q.labor)}</td></tr><tr><td colspan="2">Design + builder CAD package</td><td class="n">${money(q.design)}</td></tr><tr><td colspan="2">Sales tax</td><td class="n">${money(q.tax)}</td></tr>${q.disc?`<tr><td colspan="2">Discount</td><td class="n">−${money(q.disc)}</td></tr>`:""}<tr><td colspan="2"><b>Estimated total</b></td><td class="n"><b>${money(q.total)}</b></td></tr></tbody></table>`; }
  if(kind==="builder"){ tmp.innerHTML=builderHTML(c); body=`<h2>Plan — backing, power, data, tubes</h2>${planSVG(c,"builder")}`+["screen","left","right","rear"].map(w=>`<h2>${cap(w)} wall</h2>${elevSVG(c,w,"builder")}`).join("")+[...tmp.querySelectorAll(".panel")].slice(2).map(p=>`<h2>${p.querySelector("h2").textContent}</h2>${p.querySelector(".panel-b").innerHTML}`).join(""); }
  if(kind==="installer"){ tmp.innerHTML=installerHTML(c); const sched=tmp.querySelectorAll(".panel")[1]; body=`<h2>Placement plan</h2>${planSVG(c,"installer")}<h2>Placement schedule</h2>${sched.querySelector(".panel-b").innerHTML}`+["screen","left","right","rear"].map(w=>`<h2>${cap(w)} wall</h2>${elevSVG(c,w,"installer")}`).join("")+`<h2>Install sequence</h2><ol>${steps(c).map(s=>`<li><b>${esc(s[1])}</b> — ${esc(s[2])}</li>`).join("")}</ol>`; }
  const html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(j.name)} — ${kind}</title><style>${css}</style></head><body>${head}${body}</body></html>`;
  const fn=(j.name||"job").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-")+"-"+kind+".html";
  try{ await S.downloads.save({filename:fn, data:html}); toast("Saved "+fn); }
  catch(err){ if(err&&err.code==="declined") return; toast("Download unavailable here"); }
}

/* ---------------- Persistence (shared db) ---------------- */
let saveT=0, saving=false;
function markDirty(){ S.dirty=true; setSaveState(); if(S.currentId && S.db){ clearTimeout(saveT); saveT=setTimeout(saveJob,1200); } }
function setSaveState(msg){ const el=$("#saveState"); if(msg){el.textContent=msg;return;} if(!S.db){el.textContent="Not saved (offline view)";return;} el.textContent = !S.currentId? (S.job.example?"Example — not saved":"New — not saved") : S.dirty? "Unsaved changes…" : "Saved"; }
function jobPayload(){ const j=S.job; return {name:j.name||"Untitled", client:j.client||"", clientType:j.clientType, location:j.location||"", rep:j.rep||"", status:j.status, notes:j.notes||"", discount:+j.discount||0, spec:j.spec, checklist:j.checklist||{}, updatedAt:Date.now(), createdAt:j.createdAt||Date.now(), updatedBy:S.uid||null}; }
async function saveJob(){
  if(!S.db){ toast("Saving is unavailable in this view"); return; }
  if(saving) { clearTimeout(saveT); saveT=setTimeout(saveJob,800); return; }
  saving=true; setSaveState("Saving…");
  try{
    if(S.job.example){ S.job.example=false; if(S.job.name.startsWith("Example")) S.job.name=S.job.name.replace(/^Example — /,""); }
    const data=jobPayload();
    if(!S.currentId){ const ref=S.db.collection("jobs").doc(); S.currentId=ref.id; await ref.set(data); }
    else await S.db.doc("jobs/"+S.currentId).set(data);
    S.job.createdAt=data.createdAt; S.dirty=false; setSaveState(); fillForm(); renderJobSel(); render();
  }catch(err){ setSaveState("Save failed"); toast(err?.code==="permission_denied"||err?.code==="not_granted"?"You have view-only access to this planner":"Save failed — check your connection and press Save again"); }
  finally{ saving=false; }
}
function openJob(id){
  const j=S.jobs.get(id); if(!j) return;
  S.currentId=id; S.job=JSON.parse(JSON.stringify({...j, spec:{...DEFAULT_SPEC,...j.spec}})); S.dirty=false;
  fillForm(); renderJobSel(); setSaveState(); if(S.tab==="jobs") S.tab="sales"; render(); try{localStorage.setItem("ql_last",id)}catch(_){}
}
function renderJobSel(){
  const sel=$("#jobSel"); const list=[...S.jobs.entries()].sort((a,b)=>(b[1].updatedAt||0)-(a[1].updatedAt||0));
  let h = S.currentId? "" : `<option value="">${esc(S.job.name)}${S.job.example?" (example)":" (unsaved)"}</option>`;
  h+=list.map(([id,j])=>`<option value="${id}" ${id===S.currentId?"selected":""}>${esc(j.name)} — ${esc(j.status)}</option>`).join("");
  sel.innerHTML=h || `<option>No jobs</option>`;
}
$("#jobSel").addEventListener("change",e=>{ if(e.target.value) openJob(e.target.value); });
$("#newBtn").addEventListener("click",()=>{ S.currentId=null; S.job=newJob(false); S.dirty=false; fillForm(); renderJobSel(); setSaveState(); S.tab="sales"; render(); });
$("#dupBtn").addEventListener("click",()=>{ const copy=JSON.parse(JSON.stringify(S.job)); copy.name=(copy.name||"Job")+" (copy)"; copy.example=false; copy.checklist={}; copy.status="Lead"; delete copy.createdAt; S.currentId=null; S.job=copy; S.dirty=true; fillForm(); renderJobSel(); setSaveState(); render(); toast("Duplicated — press Save job to keep it"); });
$("#saveBtn").addEventListener("click",()=>{ clearTimeout(saveT); saveJob(); });
async function savePB(){ if(!S.db) return; try{ await S.db.doc("settings/pricebook").set({...S.pb, updatedAt:Date.now()}); toast("Price book saved for everyone"); }catch(err){ toast("Couldn't save the price book — editors only"); } }

async function boot(){
  buildForm(); fillForm(); renderJobSel();
  const h=(location.hash||"").slice(1); if(["sales","builder","installer","jobs","prices"].includes(h)) S.tab=h;
  setSaveState(); render();
  if(!window.claude?.use){ $("#banner").hidden=false; $("#banner").textContent="Saving is off in this view. You can still plan and quote; open the planner in Claude to save jobs."; return; }
  const [db,user,dl]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")]);
  S.db=db; S.user=user; S.downloads=dl;
  if(user){ try{S.uid=await user.id()}catch(_){} }
  if(!db){ $("#banner").hidden=false; $("#banner").textContent="Saving is off in this view (sign in to claude.ai to save and share jobs). Planning and quoting still work."; setSaveState(); render(); return; }
  setSaveState(); render();
  db.doc("settings/pricebook").onSnapshot(s=>{ if(s.exists){ const d={...s.data()}; delete d.updatedAt; S.pb={...DEFAULT_PB,...d}; if(S.tab!=="prices") render(); } },()=>{});
  let first=true;
  db.collection("jobs").orderBy("updatedAt","desc").limit(500).onSnapshot(snap=>{
    S.jobs=new Map(snap.docs.map(d=>[d.id,d.data()]));
    if(first){ first=false; let last=null; try{last=localStorage.getItem("ql_last")}catch(_){} if(last && S.jobs.has(last) && !S.dirty) { openJob(last); return; } }
    if(S.currentId && S.jobs.has(S.currentId) && !S.dirty && !saving){ const remote=S.jobs.get(S.currentId); if((remote.updatedAt||0)>(S.job.updatedAt||0)) { S.job=JSON.parse(JSON.stringify({...remote,spec:{...DEFAULT_SPEC,...remote.spec}})); fillForm(); } }
    renderJobSel(); if(S.tab==="jobs"||!S.dirty) render();
  },err=>{ $("#banner").hidden=false; $("#banner").textContent="Lost the connection to saved jobs. Reload the page to reconnect."; });
}
boot();
</script>

</body></html>
